  <h1>英単語クイズ</h1>

  <div id="setup-screen">
    <h3>出題形式</h3>
    <label><input type="radio" name="direction" value="en-ja" checked> 英語 → 日本語</label>
    <label><input type="radio" name="direction" value="ja-en"> 日本語 → 英語</label>

    <h3>モード選択</h3>
    <select id="mode" onchange="updateModeSettings()">
      <option value="normal">通常モード</option>
      <option value="timeattack">タイムアタック</option>
      <option value="30s">30秒チャレンジ</option>
      <option value="review">❌ 間違い復習</option>
    </select>

    <h3>出題範囲</h3>
    番号 <input type="number" id="from" value="1" style="width:60px"> ～ 
    <input type="number" id="to" value="10" style="width:60px">

    <div id="normal-settings">
      <p>通常モード：1問あたりの時間（秒）</p>
      <input type="number" id="normalTime" value="10">
    </div>

    <div id="ta-settings">
      <p>タイムアタック：出題数</p>
      <input type="number" id="taCount" value="5">
    </div>

    <button onclick="startQuiz()">スタート</button>
    <button onclick="showHistory()">📋 履歴を表示</button>
    <button onclick="clearMissed()">❌ 間違いリストをリセット</button>
    <div id="history"></div>
  </div>

    <h2 id="question"></h2>
    <div id="options"></div>
    <p id="timer"></p>
    <p>✅ <span id="correct">0</span> ❌ <span id="wrong">0</span></p>
    <p id="score"></p>
    <button onclick="stopQuiz()">中断する</button>

    let mode, direction, correct = 0, wrong = 0, quizCount = 0, quizMax = 0;
    let timerId, timeLeft = 0, startTime = 0, currentWord;
    let quizPool = [], missedWords = [];
    let rangeFrom = 0, rangeTo = 0;

    function updateModeSettings() {
      const m = document.getElementById("mode").value;
      document.getElementById("normal-settings").style.display = (m === "normal") ? "block" : "none";
      document.getElementById("ta-settings").style.display = (m === "timeattack") ? "block" : "none";
    }

    window.onload = updateModeSettings;
    function startQuiz() {
      missedWords = [];
      direction = document.querySelector("input[name='direction']:checked").value;
      mode = document.getElementById("mode").value;
      rangeFrom = parseInt(document.getElementById("from").value);
      rangeTo = parseInt(document.getElementById("to").value);

      if (mode === "review") {
        const raw = localStorage.getItem("missed_words");
        let missed;
        try {
          missed = JSON.parse(raw);
        } catch (e) {
          alert("間違いリストの読み込みに失敗しました。リセットして再試行してください。");
          return;
        }

        if (!Array.isArray(missed) || missed.length === 0 || !missed.every(w => w.en && w.ja)) {
          alert("復習対象が存在しない、または形式が不正です。");
          return;
        }
        quizPool = [...missed];
      } else {
        quizPool = words.slice(rangeFrom - 1, rangeTo);
        if (quizPool.length < 1) {
          alert("範囲が正しくありません。");
          return;
        }
      }

      correct = wrong = quizCount = 0;
      document.getElementById("correct").textContent = 0;
      document.getElementById("wrong").textContent = 0;
      document.getElementById("score").textContent = "";
      document.getElementById("history").innerHTML = "";

      document.getElementById("setup-screen").style.display = "none";
      document.getElementById("quiz-screen").style.display = "block";

      if (mode === "30s") {
        timeLeft = 30;
        start30sTimer();
      } else if (mode === "timeattack") {
        quizMax = parseInt(document.getElementById("taCount").value);
        startTime = Date.now();
        startTimeAttackTimer();
      }

      nextQuestion();
    }

    function nextQuestion() {
      if (quizPool.length === 0) {
        endQuiz("出題単語がありません。");
        return;
      }

      if (mode === "timeattack" && quizCount >= quizMax) {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        endQuiz(`終了！正解：${correct} 不正解：${wrong}｜経過時間：${elapsed}s`);
        return;
      }

      currentWord = quizPool[Math.floor(Math.random() * quizPool.length)];
      const correctAnswer = direction === "en-ja" ? currentWord.ja : currentWord.en;
      const uniqueOptions = new Set([correctAnswer]);

      while (uniqueOptions.size < 9 && quizPool.length > 1) {
        const rand = quizPool[Math.floor(Math.random() * quizPool.length)];
        const distractor = direction === "en-ja" ? rand.ja : rand.en;
        if (distractor !== correctAnswer) {
          uniqueOptions.add(distractor);
        }
      }

      const options = Array.from(uniqueOptions).sort(() => Math.random() - 0.5);

      document.getElementById("question").textContent =
        direction === "en-ja" ? currentWord.en : currentWord.ja;

      const optBox = document.getElementById("options");
      optBox.innerHTML = "";
      options.forEach(opt => {
        const btn = document.createElement("button");
        btn.textContent = opt;
        btn.className = "option";
        btn.onclick = () => checkAnswer(opt);
        optBox.appendChild(btn);
      });

      if (mode === "normal") {
        timeLeft = parseInt(document.getElementById("normalTime").value);
        updateTimer();
        clearInterval(timerId);
        timerId = setInterval(() => {
          timeLeft--;
          updateTimer();
          if (timeLeft <= 0) {
            clearInterval(timerId);
            wrong++;
            missedWords.push(currentWord);
            document.getElementById("wrong").textContent = wrong;
            setTimeout(nextQuestion, 100);
          }
        }, 1000);
      }
    }

    function checkAnswer(answer) {
      const correctAnswer = direction === "en-ja" ? currentWord.ja : currentWord.en;
      if (answer === correctAnswer) {
        correct++;
      } else {
        wrong++;
        missedWords.push(currentWord);
        if (mode === "timeattack") {
          startTime -= 5000;
        }
      }
      quizCount++;
      document.getElementById("correct").textContent = correct;
      document.getElementById("wrong").textContent = wrong;
      if (mode === "30s") document.getElementById("score").textContent = `スコア: ${correct - wrong}`;
      if (mode === "normal") clearInterval(timerId);
      setTimeout(nextQuestion, 100);
    }

    function updateTimer() {
      document.getElementById("timer").textContent =
        mode === "timeattack"
          ? `経過時間: ${Math.floor((Date.now() - startTime) / 1000)}s`
          : `残り時間: ${timeLeft}s`;
    }

    function start30sTimer() {
      updateTimer();
      clearInterval(timerId);
      timerId = setInterval(() => {
        timeLeft--;
        updateTimer();
        if (timeLeft <= 0) {
          clearInterval(timerId);
          endQuiz(`終了！スコア: ${correct - wrong}`);
        }
      }, 1000);
    }

    function startTimeAttackTimer() {
      updateTimer();
      timerId = setInterval(updateTimer, 1000);
    }

    function endQuiz(message) {
      clearInterval(timerId);
      alert(message);
      saveResult();
      showHistory();
      resetToHome();
    }

    function stopQuiz() {
      clearInterval(timerId);
      saveResult();
      resetToHome();
    }

    function resetToHome() {
      document.getElementById("quiz-screen").style.display = "none";
      document.getElementById("setup-screen").style.display = "block";
    }

    function saveResult() {
      const history = JSON.parse(localStorage.getItem("quiz_history") || "[]");
      const now = new Date().toLocaleString();
      const prevMissed = JSON.parse(localStorage.getItem("missed_words") || "[]");
      const newMissed = [...prevMissed, ...missedWords];
      localStorage.setItem("missed_words", JSON.stringify(newMissed));

      const record = {
        date: now,
        mode: mode,
        correct: correct,
        wrong: wrong,
        range: mode === "review" ? "復習単語" : `${rangeFrom}～${rangeTo}`,
        reviewCount: missedWords.length
      };
      if (mode === "timeattack") {
        record.elapsed = Math.floor((Date.now() - startTime) / 1000);
      } else {
        record.score = correct - wrong;
      }
      history.push(record);
      localStorage.setItem("quiz_history", JSON.stringify(history));
    }

    function showHistory() {
      const records = JSON.parse(localStorage.getItem("quiz_history") || "[]");
      const historyEl = document.getElementById("history");
      if (records.length === 0) {
        historyEl.innerHTML = "<p>履歴はまだありません。</p>";
        return;
      }

      let list = "<h3>📋 過去の履歴</h3><ul>";
      records.slice().reverse().forEach(r => {
        let entry = `${r.date}｜モード: ${r.mode}｜範囲: ${r.range}｜✅${r.correct} ❌${r.wrong}`;
        if (r.mode === "timeattack") entry += `｜経過時間: ${r.elapsed}s`;
        else entry += `｜スコア: ${r.score}`;
        if (r.reviewCount > 0) entry += `｜復習対象: ${r.reviewCount}語`;
        list += `<li>${entry}</li>`;
      });
      list += "</ul>";
      historyEl.innerHTML = list;
    }

    function clearMissed() {
      if (confirm("間違いリストを本当に削除しますか？")) {
        localStorage.removeItem("missed_words");
        alert("間違いリストをリセットしました！");
      }
    }
  </script>
</body>
</html>
